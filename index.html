<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPU Scheduling Game with Animation</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f7f7f7; }
    h1 { color: #333; }
    .process { margin: 5px; padding: 10px; background: #fff; border: 1px solid #ccc; border-radius: 8px; display: inline-block; }
    button { margin: 5px; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; background: #4CAF50; color: white; }
    #log { margin-top: 20px; text-align: left; max-width: 700px; margin-left: auto; margin-right: auto; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
    #explanation { margin-top: 15px; font-style: italic; background: #e8f5e9; padding: 10px; border-radius: 6px; }
    #timeline { margin-top: 20px; max-width: 700px; margin-left: auto; margin-right: auto; background: #eee; height: 40px; border-radius: 8px; overflow: hidden; display: flex; }
    .bar { height: 40px; text-align: center; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    #inputForm { margin-top: 20px; background: #fff; padding: 15px; border-radius: 10px; display: none; }
    input { margin: 5px; padding: 5px; }
  </style>
</head>
<body>
  <h1>CPU Scheduling Simulator 🎮</h1>
  <p>Click an algorithm and watch the processes run!</p>

  <div id="processes"></div>
  <br>
  <button onclick="schedule('FCFS')">First Come First Serve</button>
  <button onclick="schedule('RR')">Round Robin (q=2)</button>
  <button onclick="schedule('PRIORITY')">Priority Scheduling</button>
  <button onclick="schedule('MLQ')">Multilevel Queue</button>
  <button onclick="showForm()">➕ Enter Your Own Processes</button>

  <div id="inputForm">
    <h3>Add a Process</h3>
    <input type="text" id="pid" placeholder="Process ID (P5)">
    <input type="number" id="burst" placeholder="Burst Time">
    <input type="number" id="priority" placeholder="Priority (1=high)">
    <select id="queueType">
      <option value="system">System</option>
      <option value="user">User</option>
    </select>
    <button onclick="addProcess()">Add</button>
    <button onclick="hideForm()">Done</button>
  </div>

  <div id="timeline"></div>
  <div id="log"></div>
  <div id="explanation"></div>

  <script>
    // Default processes
    let processes = [
      {id: 'P1', burst: 5, priority: 2, queue: 'system'},
      {id: 'P2', burst: 3, priority: 1, queue: 'user'},
      {id: 'P3', burst: 8, priority: 3, queue: 'system'},
      {id: 'P4', burst: 6, priority: 2, queue: 'user'}
    ];

    let colors = ["#ff6f61","#6b5b95","#88b04b","#f7cac9","#92a8d1","#955251","#b565a7","#009688"];

    function renderProcesses() {
      let html = "";
      processes.forEach(p => {
        html += `<div class='process'>
                   <b>${p.id}</b><br>
                   Burst: ${p.burst}<br>
                   Priority: ${p.priority}<br>
                   Queue: ${p.queue}
                 </div>`;
      });
      document.getElementById("processes").innerHTML = html;
    }

    function logMessage(msg) {
      document.getElementById("log").innerHTML += msg + "<br>";
    }

    function resetLog() {
      document.getElementById("log").innerHTML = "";
      document.getElementById("timeline").innerHTML = "";
      document.getElementById("explanation").innerHTML = "";
    }

    function playBeep() {
      let ctx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = 600;
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    }

    async function animateExecution(sequence, explanation) {
      let timeline = document.getElementById("timeline");
      timeline.innerHTML = "";
      for (let i = 0; i < sequence.length; i++) {
        let task = sequence[i];
        let bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = (task.units * 40) + "px"; // each unit = 40px
        bar.style.background = colors[i % colors.length];
        bar.innerText = task.id;
        timeline.appendChild(bar);
        logMessage(`${task.id} runs for ${task.units} units`);
        playBeep();
        await new Promise(r => setTimeout(r, 800)); // animation delay
      }
      document.getElementById("explanation").innerHTML = explanation;
    }

    function schedule(type) {
      resetLog();
      let queue = JSON.parse(JSON.stringify(processes));
      let sequence = [];
      let explanation = "";

      if (type === "FCFS") {
        explanation = "FCFS runs processes in the order they arrive. Simple but can cause delays for shorter jobs.";
        queue.forEach(p => sequence.push({id: p.id, units: p.burst}));
      }

      else if (type === "RR") {
        let quantum = 2;
        explanation = "Round Robin gives each process a time slice (2 units). If not finished, it goes back in line. This ensures fairness.";
        while (queue.length > 0) {
          let p = queue.shift();
          let run = Math.min(quantum, p.burst);
          p.burst -= run;
          sequence.push({id: p.id, units: run});
          if (p.burst > 0) queue.push(p);
        }
      }

      else if (type === "PRIORITY") {
        explanation = "Priority Scheduling runs higher-priority processes first (lower number = higher priority). May cause starvation of low-priority tasks.";
        queue.sort((a, b) => a.priority - b.priority);
        queue.forEach(p => sequence.push({id: p.id, units: p.burst}));
      }

      else if (type === "MLQ") {
        explanation = "Multilevel Queue Scheduling divides processes into groups (system vs user). System runs first, then user.";
        let systemQueue = queue.filter(p => p.queue === 'system');
        let userQueue = queue.filter(p => p.queue === 'user');
        systemQueue.forEach(p => sequence.push({id: p.id, units: p.burst}));
        userQueue.forEach(p => sequence.push({id: p.id, units: p.burst}));
      }

      animateExecution(sequence, explanation);
    }

    function showForm() {
      document.getElementById("inputForm").style.display = "block";
    }

    function hideForm() {
      document.getElementById("inputForm").style.display = "none";
      renderProcesses();
    }

    function addProcess() {
      let pid = document.getElementById("pid").value || `P${processes.length+1}`;
      let burst = parseInt(document.getElementById("burst").value) || 1;
      let priority = parseInt(document.getElementById("priority").value) || 1;
      let queue = document.getElementById("queueType").value;

      processes.push({id: pid, burst: burst, priority: priority, queue: queue});
      renderProcesses();
    }

    renderProcesses();
  </script>
</body>
</html>
